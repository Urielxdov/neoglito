services:

  api:
    build: . # Usamos el Dockerfile ya hecho
    ports:
      - "3000:3000" # PC:Contenedor
    volumes:
      - .:/app # Carpeta actual -> carpeta a la que vamos a mandar el cotenido dentro del contenedor
      - /app/node_modules # aisla el node_modules del contenedor
      - /var/run/docker.sock:/var/run/docker.sock # Permite usar el daemon de Docker del host
    environment:
      NODE_ENV: development

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/neoglito
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/auth/github/callback}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
      # Host desde el que la API alcanza los puertos publicados por los despliegues
      CONTAINER_PROBE_HOST: ${CONTAINER_PROBE_HOST:-host.docker.internal}
      # Telemetría: la API envía su propia telemetría al collector y recibe, vía el
      # collector, la de los contenedores desplegados (ver src/telemetry)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      TELEMETRY_SYSTEM_TOKEN: ${TELEMETRY_SYSTEM_TOKEN:-}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      TELEMETRY_AUTO_INSTRUMENTATION: ${TELEMETRY_AUTO_INSTRUMENTATION:-true}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-7}
      # Collector visto desde los contenedores desplegados (puerto publicado en el host)
      TELEMETRY_DEPLOYMENT_COLLECTOR_ENDPOINT: ${TELEMETRY_DEPLOYMENT_COLLECTOR_ENDPOINT:-http://host.docker.internal:4318}
      # URL para conectarnos a PostgreSQL
      # postgres:postgres → usuario:contraseña
      # @postgres → nombre del servicio de PostgreSQL
      # 5432 → puerto de PostgreSQL
      # repository_analyzer → nombre de la base de datos


    extra_hosts:
      - "host.docker.internal:host-gateway" # Necesario en Linux; Docker Desktop ya lo resuelve

    depends_on:
      postgres: # Si este no esta levantado nosotros no levantamos el api
        condition: service_healthy # Espera que se acepten conexiones reales
      redis:
        condition: service_healthy
    command: >
      sh -c "npm ci --include=dev &&
             npx prisma generate &&
             npx prisma db push &&
             npm run start:dev"

  postgres:
    image: postgres:17-alpine

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neoglito"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

    environment:
      POSTGRES_DB: neoglito
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432" # PC:Contenedor

    volumes:
      - postgres_data:/var/lib/postgresql/data # Guarda los datos de postgresql fuera del cotenedor

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    command: >
      sh -c "npm ci --include=dev &&
             npm --workspace @neoglito/web run dev -- --host 0.0.0.0"
  otel-collector:
    # Distribución contrib: headers_setter (token por deployment) no está en la core
    image: otel/opentelemetry-collector-contrib:0.162.0
    ports:
      - "4318:4318" # OTLP/HTTP
    volumes:
      - ./src/telemetry/infrastructure/collector/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      # Con la API fuera de Docker usar http://host.docker.internal:3000/telemetry/ingest
      NEOGLITO_INGEST_URL: ${NEOGLITO_INGEST_URL:-http://api:3000/telemetry/ingest}
    depends_on:
      - api

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data: 
